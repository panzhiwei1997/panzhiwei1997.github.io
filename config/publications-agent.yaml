  managed_region_end: "<!-- PUBLICATIONS:END -->"
  cv_stats_region_start: "<!-- PUBLICATIONS_STATS:START -->"
  cv_stats_region_end: "<!-- PUBLICATIONS_STATS:END -->"

author:
  display_name: "Pan, Z."
  match_names:
    - "Pan, Zhiwei"
    - "Pan, Z."
    - "Pan, Z"
    - "Zhiwei Pan"

formatting:
