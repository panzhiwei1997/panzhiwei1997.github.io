  # Fallback query if library_id is removed.
  query: 'author:"Pan, Zhiwei" OR author:"Pan, Z"'
  rows: 200
  sort: "date desc"

site:
  publications_page: "_pages/publications.html"
  cv_page: "_pages/cv.md"
